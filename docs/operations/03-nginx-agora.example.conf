# =============================================================================
# Importante: NO hacer algo como esto para Next.js:
#
#   location /_next/static/ {
#       alias /var/www/agora/prod/store-front/.next/static/;
#   }
#
# El path real incluye BUILD_ID: .next/static/<BUILD_ID>/...
# y BUILD_ID cambia en cada build. Solo proxy_pass al puerto Node.
# =============================================================================
