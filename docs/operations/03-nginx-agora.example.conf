# =============================================================================
# Ejemplo de configuración nginx para AGORA (proxy reverso)
# =============================================================================
# Los sitios Next.js (store-front, web-admin, web-local) deben recibir TODAS
# las peticiones por proxy (incluido /_next/static). Si nginx intenta servir
# /_next/* desde disco, devolverá 404 porque el BUILD_ID cambia en cada deploy.
#
# Copiar a /etc/nginx/sites-available/ y enlazar desde sites-enabled.
# Ajustar server_name y puertos según tu entorno.
# =============================================================================

# Store-front (marketplace) – si agoramp.mx es el store-front
server {
    listen 80;
    listen [::]:80;
    server_name agoramp.mx www.agoramp.mx;

    location / {
        proxy_pass http://127.0.0.1:4016;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Opcional: redirigir HTTP a HTTPS si usas SSL
    # return 301 https://$server_name$request_uri;
}

